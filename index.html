<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Editor — free online markdown editor with live preview</title>
<meta name="description" content="A free markdown editor that runs entirely in your browser: live editable preview, syntax highlighting, Mermaid diagrams, LaTeX math, tables, checklists, dark mode and RTL. No sign-up, nothing to install.">
<link rel="canonical" href="https://markdowneditor.ir/">

<!-- Open Graph / Twitter: controls the title, description and image when the
     link is shared or previewed -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="MD Editor">
<meta property="og:title" content="MD Editor — free online markdown editor">
<meta property="og:description" content="Write markdown in your browser with live preview, syntax highlighting, diagrams, math and export. No sign-up, nothing to install.">
<meta property="og:url" content="https://markdowneditor.ir/">
<meta property="og:image" content="https://markdowneditor.ir/icon.svg">
<meta name="twitter:card" content="summary">

<!-- Structured data: tells Google the site's real name (otherwise it guesses
     one from the domain) and what kind of thing this page is -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "MD Editor",
  "url": "https://markdowneditor.ir/",
  "applicationCategory": "Productivity",
  "operatingSystem": "Any (web browser)",
  "description": "A free, in-browser markdown editor with live preview, syntax highlighting, Mermaid diagrams, LaTeX math and export.",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "author": { "@type": "Person", "name": "Vahid Askari", "url": "https://github.com/vahidaskari" }
}
</script>

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Icon sprite. Inline SVG rather than Unicode glyphs: a glyph is drawn by
     whatever font the device happens to have, so ⤓ and friends came out thin,
     inconsistent, or as a blank box. These are identical everywhere, stay sharp
     at any resolution, and take their colour from currentColor. -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute" focusable="false"><defs>
  <symbol id="i-brand" viewBox="0 0 32 32">
    <path d="M7.36 13.41Q7.1 13.14 7.1 12.78Q7.1 12.4 7.39 12.1L12.06 7.45Q12.39 7.12 12.79 7.12Q13.15 7.12 13.41 7.38L26.78 20.75Q27.04 21.01 27.04 21.35Q27.04 21.77 26.71 22.1L22.01 26.8Q21.71 27.06 21.33 27.06Q20.98 27.06 20.74 26.82L7.36 13.41ZM10.65 6.05L6.02 10.68Q5.67 11.03 5.26 11.03Q4.91 11.03 4.67 10.78Q4.6 10.71 4.46 10.55Q4.32 10.39 4.15 10.19Q3.99 10 3.82 9.8Q3.64 9.59 3.52 9.45Q3.26 9.15 3.13 8.7Q3 8.25 3 7.73Q3 6.9 3.34 5.99Q3.68 5.09 4.39 4.38Q5.12 3.65 5.97 3.34Q6.82 3.03 7.6 3.03Q8.15 3.03 8.63 3.16Q9.11 3.29 9.44 3.53L10.78 4.69Q10.98 4.95 10.98 5.28Q10.98 5.72 10.65 6.05ZM27.73 28.71L23.49 27.9Q23.36 27.85 23.22 27.81Q23.11 27.77 23.01 27.69Q22.83 27.52 22.83 27.29Q22.83 26.94 23.21 26.56L26.65 23.11Q26.83 22.97 27.01 22.87Q27.18 22.76 27.36 22.76Q27.5 22.76 27.71 22.91Q27.89 23.14 27.97 23.42L28.76 27.67L28.79 27.9Q28.79 28.25 28.59 28.51Q28.31 28.72 27.94 28.72Q27.81 28.72 27.73 28.71Z" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-export" viewBox="0 0 24 24">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
  </symbol>
  <symbol id="i-copy" viewBox="0 0 24 24">
    <rect x="9" y="9" width="13" height="13" rx="2"/>
    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
  </symbol>
  <symbol id="i-read" viewBox="0 0 24 24">
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
  </symbol>
  <symbol id="i-both" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/>
  </symbol>
  <symbol id="i-editor" viewBox="0 0 24 24">
    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
    <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/>
  </symbol>
  <symbol id="i-preview" viewBox="0 0 24 24">
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
  </symbol>
  <symbol id="i-theme" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-more" viewBox="0 0 24 24">
    <circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/>
    <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
    <circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-clear" viewBox="0 0 24 24">
    <path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
    <path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
  </symbol>
  <symbol id="i-open" viewBox="0 0 24 24">
    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
  </symbol>
  <symbol id="i-sync" viewBox="0 0 24 24">
    <path d="M7 21V3"/><path d="M3 7l4-4 4 4"/><path d="M17 3v18"/><path d="M13 17l4 4 4-4"/>
  </symbol>
  <symbol id="i-dir" viewBox="0 0 24 24">
    <path d="M3 12h18"/><path d="M7 8l-4 4 4 4"/><path d="M17 8l4 4-4 4"/>
  </symbol>
</defs></svg>

<!-- Every button carries an .ic icon and a .lbl caption. Desktop shows the
     caption; the narrow layout shows the icon alone and folds the secondary
     buttons into the ⋯ sheet. The buttons MOVE between the two arrangements —
     nothing is duplicated — so each one keeps its single handler. -->
<header>
  <span class="brand"><span class="ic"><svg><use href="#i-brand"/></svg></span><span class="lbl">MD Editor</span></span>
  <span class="menu" id="exportMenu">
    <button id="exportBtn" title="Export as…" aria-label="Export as">
      <span class="ic" aria-hidden="true"><svg><use href="#i-export"/></svg></span><span class="lbl">Export ▾</span></button>
    <span class="menu-list">
      <button data-export="md">Markdown (.md)</button>
      <button data-export="pdf">PDF (.pdf)</button>
      <button data-export="html">HTML (.html)</button>
    </span>
  </span>
  <span class="menu" id="copyMenu">
    <button id="copyBtn" title="Copy as…" aria-label="Copy as">
      <span class="ic" aria-hidden="true"><svg><use href="#i-copy"/></svg></span><span class="lbl">Copy ▾</span></button>
    <span class="menu-list">
      <button data-copy="md">Markdown</button>
      <button data-copy="text">Plain text</button>
      <button data-copy="html">HTML</button>
    </span>
  </span>
  <span class="spacer"></span>
  <button id="readBtn" title="Reading mode (Esc to leave)" aria-label="Reading mode">
    <span class="ic" aria-hidden="true"><svg><use href="#i-read"/></svg></span><span class="lbl">Reading Mode</span></button>
  <button id="viewBtn" title="Switch which pane is shown" aria-label="Switch pane">
    <span class="ic" aria-hidden="true"><svg><use href="#i-both"/></svg></span><span class="lbl">Both</span></button>
  <button id="themeBtn" title="Toggle dark / light" aria-label="Toggle theme">
    <span class="ic" aria-hidden="true"><svg><use href="#i-theme"/></svg></span><span class="lbl">Theme</span></button>
  <span class="menu" id="moreMenu">
    <button id="moreBtn" title="More" aria-label="More actions">
      <span class="ic" aria-hidden="true"><svg><use href="#i-more"/></svg></span></button>
    <span class="menu-list">
      <button id="clearBtn" title="Clear editor (undo with Ctrl+Z)" aria-label="Clear editor">
        <span class="ic" aria-hidden="true"><svg><use href="#i-clear"/></svg></span><span class="lbl">Clear</span></button>
      <button id="openBtn" title="Open a .md file" aria-label="Open a file">
        <span class="ic" aria-hidden="true"><svg><use href="#i-open"/></svg></span><span class="lbl">Open</span></button>
      <button id="syncBtn" title="Sync scrolling between editor and preview" aria-label="Sync scroll">
        <span class="ic" aria-hidden="true"><svg><use href="#i-sync"/></svg></span><span class="lbl">Sync Scroll</span></button>
      <button id="dirBtn" title="Toggle text direction (LTR / RTL)" aria-label="Text direction">
        <span class="ic" aria-hidden="true"><svg><use href="#i-dir"/></svg></span><span class="lbl">RTL</span></button>
    </span>
  </span>
  <a id="ghLink" href="https://github.com/vahidaskari/md-editor" target="_blank" rel="noopener" title="View source on GitHub" aria-label="GitHub repository">
    <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
  <input type="file" id="fileInput" accept=".md,.markdown,.txt,text/markdown" hidden>
</header>

<!-- Find & replace bar (Ctrl/Cmd+F) -->
<div id="findbar" class="findbar" hidden>
  <input id="findInput" type="text" placeholder="Find" aria-label="Find" autocomplete="off">
  <input id="replaceInput" type="text" placeholder="Replace" aria-label="Replace with" autocomplete="off">
  <span id="findCount" class="find-count"></span>
  <button id="findPrev" title="Previous (Shift+Enter)">↑</button>
  <button id="findNext" title="Next (Enter)">↓</button>
  <button id="replaceOne" title="Replace">Replace</button>
  <button id="replaceAll" title="Replace all">Replace all</button>
  <button id="findClose" title="Close (Esc)">✕</button>
</div>

<main class="main">
  <div class="pane edit-pane">
    <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off"
              autocapitalize="off" placeholder="# Write markdown here…"></textarea>
  </div>
  <div class="divider" id="divider" title="Drag to resize"></div>
  <div class="pane preview-pane">
    <div class="preview" id="preview"></div>
  </div>
</main>

<!-- Floating formatting toolbar for the editable preview -->
<div id="fmtbar" class="fmtbar" hidden>
  <button data-cmd="bold" title="Bold"><b>B</b></button>
  <button data-cmd="italic" title="Italic"><i>I</i></button>
  <button data-cmd="strike" title="Strikethrough"><s>S</s></button>
  <button data-cmd="code" title="Inline code">&lt;/&gt;</button>
  <span class="sep"></span>
  <span class="menu" id="hMenu">
    <button id="hBtn" title="Heading level">H▾</button>
    <span class="menu-list">
      <button data-cmd="h1" title="Heading 1">H1</button>
      <button data-cmd="h2" title="Heading 2">H2</button>
      <button data-cmd="h3" title="Heading 3">H3</button>
      <button data-cmd="h4" title="Heading 4">H4</button>
      <button data-cmd="h5" title="Heading 5">H5</button>
      <button data-cmd="h6" title="Heading 6">H6</button>
    </span>
  </span>
  <button data-cmd="quote" title="Quote">❝</button>
  <button data-cmd="ul" title="Bullet list">•</button>
  <button data-cmd="ol" title="Numbered list">1.</button>
  <button data-cmd="task" title="Checklist">☑</button>
  <span class="sep"></span>
  <button data-cmd="link" title="Add link">🔗</button>
  <button data-cmd="table" title="Insert table">▦</button>
</div>

<!-- Reading-mode exit (the header is hidden there) -->
<button id="readExit" class="read-exit" title="Leave reading mode (Esc)" aria-label="Leave reading mode">✕</button>

<!-- Drag & drop import overlay -->
<div id="dropzone" class="dropzone">
  <div class="box">⬇ Drop a <b>.md</b> file to import</div>
</div>

<div id="toasts"></div>

<!-- Hover target URL, like the browser's own status bar (suppressed for links
     inside contenteditable, so we provide our own) -->
<div id="linkStatus" class="link-status" hidden></div>

<footer>
  <span id="stat-words">0 words</span>
  <span id="stat-chars">0 chars</span>
  <span class="spacer"></span>
  <span class="credit">made with 🩶 by
    <a href="https://github.com/vahidaskari" target="_blank" rel="noopener">Vahid</a>
  </span>
</footer>

<!-- The only script on the critical path. The third-party libraries it needs
     for preview-editing and diagrams are fetched on demand (see app.js §3b / §5). -->
<script defer src="app.js"></script>
</body>
</html>
